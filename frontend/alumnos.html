<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="Js/storage.js" defer></script>
        <script src="Js/ui.js" defer></script>
        <script src="Js/alumnos.js" defer></script>
        <link rel="stylesheet" href="CSS/estilos.css">
        <title>SGA - Alumnos</title>
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="alumnos.html" class="activo">Alumnos</a>
                <a href="docentes.html">Docentes</a>
            </nav>
        </header>

        <main>
            <h1>Gestión de Alumnos</h1>
            <section class="formulario-container">
                <h2>Alta de Alumnos</h2>
                <form id="formulario">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre">
                    </div>
                    <div class="campo">
                        <label for="carrera"> Carrera</label>
                        <input type="text" id="carrera">
                    </div>
                    <div class="campo">
                        <label for="correo">Correo Electrónico</label>
                        <input type="texto" id="correo">
                    </div>
                    <div class="acciones-form">
                    <button type="submit" id="btnGuardar">Guardar Alumno</button>
                    <button type="button" id="btnCancelar" class="btn-cancelar">Cancelar</button>
                        </div>
                </form>
                <!-- <p id="mensaje" class="oculto"></p> -->
            </section>
            <section class="lista-container">
                <h2>Alumnos Regristrados</h2>
                <!-- <p id="cantidadAlumnos"></p> -->
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Carrera</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaAlumnos"></tbody>
                </table>
            </section>
            <div id="mensaje" class="mensaje"></div>

        </main>
    </body>
</html>
