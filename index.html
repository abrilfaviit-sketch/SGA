<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/estilos.css">
        <script src="Js/alumnos.js" defer></script>
        <title>SGA</title>
    </head>

    <body>
        <header>
            <h1>Sistema de Gestión Académica</h1>
        </header>

        <main>
            <section class="formulario">
                <h2>Alta de Alumnos</h2>
                <form id="formAlumno">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre"><br><br>

                    <label for="carrera"> Carrera</label>
                    <input type="text" id="carrera"><br><br>

                    <label for="correo">Correo Electrónico</label>
                    <input type="texto" id="correo"><br><br>

                    <button type="submit">Guardar Alumno</button>

                </form>
                <p id="mensaje" class="oculto"></p>
            </section>
            <section class="alumnos">
                <h2>Alumnos Regristrados</h2>
                <p id="cantidadAlumnos"></p>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Carrera</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaAlumnos"></tbody>
                </table>
            </section>

        </main>
    </body>
</html>
