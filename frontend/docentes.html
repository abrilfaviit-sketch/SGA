<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="Js/storage.js" defer></script>
    <script src="Js/ui.js" defer></script>
    <script src="Js/docentes.js" defer ></script>
    <link rel="stylesheet" href="CSS/estilos.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html">Alumnos</a>
            <a href="docentes.html" class="activo">Docentes</a>
        </nav>
       </header>
       <main>
            <h1>Gestión de Docentes</h1>
            <section class="formulario-container">
                <h2>Alta de Docentes</h2>
                <form id="formulario">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre">
                    </div>
                    <div class="campo">
                        <label for="materia">Materia</label>
                        <input type="text" id="materia">
                    </div>
                    <div class="campo">
                        <label for="correo">Correo Electrónico</label>
                        <input type="texto" id="correo">
                    </div>

                    <button type="submit">Guardar Docente</button>

                </form>
                <!-- <p id="mensaje" class="oculto"></p> -->
            </section>
            <section class="lista-container">
                <h2>Docentes Registrados</h2>
                <!-- <p id="cantidadDocentes"></p> -->
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Materia</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaDocentes"></tbody>
                </table>
            </section>
            <div id="mensaje" class="mensaje"></div>

        </main>
    </body>
    
</body>
</html>
